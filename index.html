<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Conteo Rápido - Acción Popular</title>
    <!-- Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #d9534f;
            text-align: center;
            margin-bottom: 5px;
        }
        p.sub {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .nav-tabs a {
            text-decoration: none;
            color: #d9534f;
            font-weight: bold;
            font-size: 14px;
        }
        .nav-tabs a.active {
            border-bottom: 3px solid #d9534f;
            padding-bottom: 7px;
        }
        .card-mesas {
            background: #fdfdfd;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
        }
        .card-mesas span {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .card-mesas h3 {
            margin: 5px 0 0 0;
            font-size: 28px;
            color: #28a745;
        }
        .btn-actualizar {
            width: 100%;
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-actualizar:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ACCIÓN POPULAR</h2>
        <p class="sub">Sistema de Conteo Rápido - Municipal</p>

        <div class="nav-tabs">
            <a href="registrar.html">📝 Registrar Mesa</a>
            <a href="#" class="active">📊 Ver Resultados y Gráfico</a>
        </div>

        <div class="card-mesas">
            <span>Mesas Procesadas:</span>
            <h3 id="lbl-mesas">0 / 41</h3>
        </div>

        <div style="width: 100%; height: 300px;">
            <canvas id="graficoResultados"></canvas>
        </div>

        <button class="btn-actualizar" onclick="cargarResultados()">🔄 Actualizar Datos</button>
    </div>

    <script>
        // URL de Apps Script actualizada
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzj8FmPa816-AWjVb5cTpgtPtAmqnZekCWT3mg08XUpE_JFZ_8_SUbdMfbC4ryoDjc4aQ/exec";

        let miGrafico = null;

        function inicializarGrafico() {
            const ctx = document.getElementById('graficoResultados').getContext('2d');
            miGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Alianza P.', 'Juntos P.', 'Acción Popular', 'Frepap', 'Perú Primero', 'Ahora Nación', 'Progresemos'],
                    datasets: [{
                        label: 'Total de Votos Acumulados',
                        data: [0, 0, 0, 0, 0, 0, 0],
                        backgroundColor: '#0a3663'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function cargarResultados() {
            const scriptId = 'jsonp-callback-script';
            let oldScript = document.getElementById(scriptId);
            if (oldScript) {
                oldScript.remove();
            }

            window.procesarRespuestaAppsScript = function(data) {
                let totales = [0, 0, 0, 0, 0, 0, 0];
                let mesasRegistradas = data.length > 0 ? data.length - 1 : 0;

                for(let i = 1; i < data.length; i++) {
                    totales[0] += Number(data[i][2]) || 0; // Alianza P.
                    totales[1] += Number(data[i][3]) || 0; // Juntos P.
                    totales[2] += Number(data[i][4]) || 0; // Acción Popular
                    totales[3] += Number(data[i][5]) || 0; // Frepap
                    totales[4] += Number(data[i][6]) || 0; // Perú Primero
                    totales[5] += Number(data[i][7]) || 0; // Ahora Nación
                    totales[6] += Number(data[i][8]) || 0; // Progresemos
                }

                document.getElementById('lbl-mesas').innerText = `${mesasRegistradas} / 41`;

                if(miGrafico) {
                    miGrafico.data.datasets[0].data = totales;
                    miGrafico.update();
                }
            };

            const script = document.createElement('script');
            script.id = scriptId;
            script.src = `${URL_SCRIPT}?callback=procesarRespuestaAppsScript`;
            script.onerror = function() {
                alert("Error al conectar con Google Sheets. Verifica la URL.");
            };
            document.body.appendChild(script);
        }

        // Cargar gráfico y datos automáticamente al abrir la página
        window.onload = function() {
            inicializarGrafico();
            cargarResultados();
        };
    </script>
</body>
</html>
